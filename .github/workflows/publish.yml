name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match an existing vX.Y.Z GitHub Release with a .vsix asset)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download vsix from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${{ inputs.version }}" --pattern "*.vsix" --dir .

      # Same command as release.yml's publish job, minus the retry loop — a human re-dispatches
      # this one. --skip-duplicate keeps a re-dispatch of an already-published version green.
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: loopboard-todo-${{ inputs.version }}.vsix
        run: npx --yes @vscode/vsce publish --packagePath "$VSIX" --skip-duplicate
