name: Build

# Per-branch build artifact: on every push to a task branch, build + test and package a
# branch-named .vsix, uploaded as a downloadable workflow artifact so any reviewer can grab the
# exact build for the branch under review and install it in local VS Code — no local toolchain.
# This is NOT a release: it never publishes to the Marketplace or creates a GitHub Release
# (that stays entirely in release.yml).

on:
  push:
    branches:
      - 'task/**'
    # Allowlist, not paths-ignore: markdown under test/fixtures/ and media/ IS input to the
    # suites, so a `**/*.md` ignore silently skipped CI for fixture and template changes. Pure
    # docs (README, VERIFICATION, decisions/, CLAUDE.md, .claude/) still produce no build.
    paths:
      - 'src/**'
      - 'media/**'
      - 'test/**'
      - 'test-e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.vscodeignore'
      - '.github/workflows/build.yml'

# Only keep the newest build per branch; a rapid re-push cancels the superseded run so artifacts
# do not pile up.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the artifact link on the branch's PR

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: npx tsc -p ./

      - name: Test
        run: |
          npx tsc -p ./tsconfig.test.json
          node --test 'test/*.test.js'

      # Catch a missing .vscodeignore negation on the branch, not on main: `make check` runs this
      # assertion only under the opt-in PACKAGE=1, so without it the first gate would be
      # release.yml — after the release job has already tagged.
      - name: Assert vsix contents
        run: sh scripts/assert-vsix-contents.sh

      # Derive the artifact token from the branch: strip a leading `task/t-` (else `task/`) prefix,
      # then sanitize any remaining `/` to `-`. e.g. `task/t-bld1` -> `bld1`.
      - name: Derive artifact filename from branch
        id: vsix
        run: |
          branch="${GITHUB_REF_NAME}"
          token="${branch#task/t-}"
          if [ "$token" = "$branch" ]; then
            token="${branch#task/}"
          fi
          token="${token//\//-}"
          echo "name=loopboard-todo-${token}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package vsix
        run: npx --yes @vscode/vsce package --no-dependencies --out "${{ steps.vsix.outputs.name }}"

      - name: Upload vsix artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vsix.outputs.name }}
          path: ${{ steps.vsix.outputs.name }}
          if-no-files-found: error

      # After a successful build, comment the artifact link on the branch's open PR (if any).
      # The push event has no PR context, so resolve the PR by head branch; skip quietly if none.
      - name: Comment vsix link on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX: ${{ steps.vsix.outputs.name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR for $GITHUB_REF_NAME — skipping comment."
            exit 0
          fi
          gh pr comment "$pr" --body "$(cat <<EOF
          📦 **Build succeeded** — installable \`.vsix\` for \`${GITHUB_REF_NAME}\` (commit \`${GITHUB_SHA:0:7}\`):

          **[$VSIX]($ARTIFACT_URL)**

          Download from the run's Artifacts, unzip, then install: \`code --install-extension $VSIX\` (or VS Code → Extensions → ⋯ → *Install from VSIX…*).
          EOF
          )"

  # Webview suite (media/*.js in a real browser). Runs in the SAME pinned Playwright image
  # test-e2e/Dockerfile builds from, so the committed screenshot baselines — recorded against that
  # image's browser and fonts — are the right ones to compare against. Kept as its own job rather
  # than a step in `build`: it needs a different container, and a webview regression should not
  # hide the .vsix artifact the build job publishes.
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # test-e2e/fixtures.js builds its board payloads out of out-test/ (the `types: []` build —
      # out/ is not needed here, since those modules import `vscode`). This is what `make e2e`
      # inherits from its `test` prerequisite.
      - name: Install root dev dependencies
        run: npm ci

      - name: Build out-test/
        run: npx tsc -p ./tsconfig.test.json

      # Into the checkout rather than the image: unlike the Docker path there is no prebuilt
      # /e2e/node_modules here. The lockfile pins @playwright/test to the image's own version.
      - name: Install the Playwright test runner
        working-directory: test-e2e
        run: npm ci

      # Same flags as `make e2e`: playwright.config.js already carries --no-sandbox and
      # --disable-dev-shm-usage (the container equivalent of the Makefile's --ipc=host), the
      # harness server, the worker count and the snapshot path template.
      - name: Webview suite
        working-directory: test-e2e
        run: npx playwright test

      - name: Upload failure traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-e2e/test-results
          if-no-files-found: ignore
