<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LoopBoard showcase stage</title>
  <link rel="stylesheet" href="/media/codicon/codicon.css" />
  <link rel="stylesheet" href="/assets/stage.css" />
</head>
<body>
  <div id="window">
    <div id="titlebar">
      <div class="lights"><span></span><span></span><span></span></div>
      <div class="menu"><span class="codicon codicon-arrow-left"></span><span class="codicon codicon-arrow-right"></span></div>
      <div class="command-center"><span class="codicon codicon-search"></span><span id="window-title">acme-api</span></div>
      <div class="menu right"><span class="codicon codicon-layout-sidebar-left"></span><span class="codicon codicon-layout-panel"></span><span class="codicon codicon-layout-sidebar-right-off"></span></div>
    </div>
    <div id="workbench">
      <div id="activitybar">
        <div class="ab-item"><span class="codicon codicon-files"></span></div>
        <div class="ab-item"><span class="codicon codicon-search"></span></div>
        <div class="ab-item"><span class="codicon codicon-source-control"></span></div>
        <div class="ab-item"><span class="codicon codicon-debug-alt"></span></div>
        <div class="ab-item"><span class="codicon codicon-extensions"></span></div>
        <div class="ab-item active" id="ab-loopboard">
          <span class="lb-icon"></span>
          <span class="ab-badge" id="ab-badge"></span>
        </div>
        <div class="ab-spacer"></div>
        <div class="ab-item"><span class="codicon codicon-account"></span></div>
        <div class="ab-item"><span class="codicon codicon-settings-gear"></span></div>
      </div>
      <div id="sidebar">
        <div class="pane-header">LOOPBOARD<span class="codicon codicon-ellipsis"></span></div>
        <iframe id="frame-sidebar" src="/webview/sidebar.html"></iframe>
      </div>
      <div id="main">
        <div id="editor">
          <div id="tabs"></div>
          <div id="breadcrumbs"></div>
          <div id="editor-body">
            <div class="group" id="group-left">
              <iframe id="frame-board" class="view" data-view="board" src="/webview/board.html"></iframe>
              <iframe id="frame-settings" class="view" data-view="settings" src="/webview/settings.html"></iframe>
              <div id="welcome" class="view" data-view="welcome">
                <div class="welcome-mark"><span class="codicon codicon-vscode"></span></div>
              </div>
            </div>
            <div class="group" id="group-right">
              <div id="tabs-right"></div>
              <div id="md-editor" class="view" data-view="markdown"><div id="md-lines"></div></div>
            </div>
          </div>
        </div>
        <div id="panel">
          <div class="panel-header">
            <span class="ptab">PROBLEMS</span><span class="ptab">OUTPUT</span><span class="ptab">DEBUG CONSOLE</span><span class="ptab active">TERMINAL</span><span class="ptab">PORTS</span>
            <span class="panel-actions"><span class="codicon codicon-add"></span><span class="codicon codicon-split-horizontal"></span><span class="codicon codicon-trash"></span><span class="codicon codicon-ellipsis"></span><span class="codicon codicon-chevron-up"></span><span class="codicon codicon-close"></span></span>
          </div>
          <div class="panel-body">
            <div id="term-screen"></div>
            <div id="term-list"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="statusbar">
      <span class="sb-remote"><span class="codicon codicon-remote"></span></span>
      <span class="sb-item"><span class="codicon codicon-git-branch"></span> main</span>
      <span class="sb-item"><span class="codicon codicon-sync"></span></span>
      <span class="sb-item"><span class="codicon codicon-error"></span> 0 <span class="codicon codicon-warning"></span> 0</span>
      <span class="sb-grow"></span>
      <span class="sb-item" id="sb-loops"></span>
      <span class="sb-item">UTF-8</span>
      <span class="sb-item">LF</span>
      <span class="sb-item"><span class="codicon codicon-bell"></span></span>
    </div>
  </div>

  <div id="band">
    <div class="band-brand"><img src="/media/loopboard-icon-128.png" alt="" />LoopBoard</div>
    <div id="caption"><span class="cap-step" id="cap-step"></span><span id="cap-text"></span></div>
    <div class="band-feature" id="band-feature"></div>
  </div>

  <div id="overlay">
    <div id="spotlight"></div>
    <div id="ripple"></div>
    <div id="cursor"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M2 1.5 L2 20.5 L6.9 15.9 L10.2 23.6 L13.6 22.1 L10.4 14.6 L17.3 14.6 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    <div id="keycap"></div>
    <div id="notification"><span class="codicon codicon-info"></span><span id="notification-text"></span><span class="codicon codicon-close nt-x"></span></div>
    <div id="title-card"><div class="tc-inner"><div class="tc-kicker" id="tc-kicker"></div><div class="tc-title" id="tc-title"></div><div class="tc-sub" id="tc-sub"></div></div></div>
    <img id="xfade" alt="" />
  </div>
  <script src="/assets/stage.js"></script>
</body>
</html>
